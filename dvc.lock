schema: '2.0'
stages:
  package_legacy:
    cmd: python -m fashion_seg.package legacy_model
    deps:
    - path: data/imaterialist/label_descriptions.json
      hash: md5
      md5: d8479cd45c24bbd73285daa5a924777d
      size: 39023
    - path: deployement
      hash: md5
      md5: d94d8cc1b1efbccb059ae08f6b077148.dir
      size: 265710485
      nfiles: 4
    - path: src/fashion_seg
      hash: md5
      md5: 500c494a1b98891a8a4cae9a4f1171c1.dir
      size: 39985
      nfiles: 10
    params:
      params.yaml:
        legacy_model:
          family: matterport
          model_dir: deployement
          label_file: data/imaterialist/label_descriptions.json
          output_dir: models/fashion-maskrcnn
          experiment: fashion-maskrcnn
          registered_name: fashion-maskrcnn
      pyproject.toml:
        tool.uv.sources:
          fashion-seg-core:
            workspace: true
          fashion-seg-torchvision:
            workspace: true
          torch:
          - index: pytorch-cpu
            marker: sys_platform == 'linux'
          torchvision:
          - index: pytorch-cpu
            marker: sys_platform == 'linux'
          fashion-seg-contract:
            url: 
              https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl
          maskrcnn-matterport:
            url: 
              https://github.com/thibaudchevrier/maskrcnn-matterport-tf2/releases/download/v0.3.1/maskrcnn_matterport-0.3.1-py3-none-any.whl
  prepare:
    cmd: python -m fashion_seg.prepare
    deps:
    - path: data/imaterialist/train.csv
      hash: md5
      md5: 7eaec314eed2d95c363ecb81f4475bb6
      size: 1437924420
    - path: packages/core/src/fashion_seg_core/annotations.py
      hash: md5
      md5: af3440e26ad226782e80c4d0dc6e8de5
      size: 2957
    - path: src/fashion_seg/prepare.py
      hash: md5
      md5: 7cfa63fb664dd84ca1f39c0965598122
      size: 2910
    params:
      params.yaml:
        data.prepared_dir: prepared
        data.train_csv: data/imaterialist/train.csv
        split:
          n_folds: 8
          fold: 0
          seed: 42
    outs:
    - path: prepared
      hash: md5
      md5: d3b65f71823b250f9188c1ab309085c4.dir
      size: 587736028
      nfiles: 2
