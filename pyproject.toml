# The repository: its version (commitizen), the root environment (DVC, lint, tests, prepare) and
# the lint configuration of all code. The code lives in packages/fashion-seg (the shared library)
# and families/<name> (one uv project per model family, with its own Python and framework).
[project]
name = "fashion-seg-train"
version = "0.3.0"
description = "Fashion instance segmentation on iMaterialist: data pipeline, training of several models, MLflow packaging"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fashion-seg"]

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "dvc[gdrive]>=3.59",
    "jsonschema>=4.26.0",
    "pre-commit>=4",
    "pydoclint>=0.10.0",
    "pylint>=4.0.9",
    "pyopenssl>=24.2.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/fashion-seg"]

[tool.uv.sources]
fashion-seg = { workspace = true }

# Lint config for all Python code. pylint's is per environment: here for the root environment
# (packages/fashion-seg, tests), in families/<name>/pyproject.toml for each family.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", "outputs", "mlartifacts", "mlruns"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify, docstrings
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.isort]
known-first-party = ["fashion_seg", "fashion_seg_matterport", "fashion_seg_torchvision"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Every parameter, return value and raised exception is documented (numpy style), with types
# matching the signature's annotations. Tests only need short docstrings (ruff D).
[tool.pydoclint]
style = "numpy"
exclude = '\.venv|tests|models|outputs'
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
check-return-types = true

[tool.pytest.ini_options]
# Docstring examples are tests too. Each family runs its own tests in its environment
# (make test-<family>).
testpaths = ["packages/fashion-seg/src", "tests"]
addopts = "--doctest-modules"

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["numpy"]

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.format]
max-line-length = 100

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0
