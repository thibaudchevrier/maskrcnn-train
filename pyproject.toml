[project]
name = "fashion-seg"
version = "0.1.0"
description = "Fashion instance segmentation (Mask R-CNN on iMaterialist): data pipeline, training and MLflow model packaging"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "tensorflow>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.59",
    "pyopenssl>=24.2.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
