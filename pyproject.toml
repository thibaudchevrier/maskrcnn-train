[project]
name = "fashion-seg"
version = "0.2.1"
description = "Fashion instance segmentation on iMaterialist: data pipeline, training of several models, MLflow packaging"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg-contract",
    "fashion-seg-core",
    "fashion-seg-torchvision",
    "maskrcnn-matterport",
    "mlflow>=3.16,<3.17",
    "numpy>=2.5.3",
    "polars>=1.20",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "tensorflow>=2.18",
    "pycocotools>=2.0.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/core", "trainers/torchvision"]

[tool.uv.sources]
fashion-seg-core = { workspace = true }
fashion-seg-torchvision = { workspace = true }
# Linux (CI, Docker, cloud CPU): CPU-only PyTorch wheels, without ~2 GB of CUDA libraries.
# macOS wheels include the Apple GPU (MPS) backend.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# Released wheels, referenced by URL like packages from a registry (GitHub Releases).
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl" }
maskrcnn-matterport = { url = "https://github.com/thibaudchevrier/maskrcnn-matterport-tf2/releases/download/v0.3.1/maskrcnn_matterport-0.3.1-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg"]

# Lint config for all Python code (src/, tests/, packages/, trainers/). pylint's is per
# environment: here for the orchestration env, in trainers/<name>/pyproject.toml for trainers.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", "outputs", "mlartifacts"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify, docstrings
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.isort]
known-first-party = ["fashion_seg", "fashion_seg_core", "fashion_seg_matterport", "fashion_seg_torchvision"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Every parameter, return value and raised exception is documented (numpy style), with types
# matching the signature's annotations. Tests only need short docstrings (ruff D).
[tool.pydoclint]
style = "numpy"
exclude = '\.venv|tests|models|outputs'
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
check-return-types = true

[tool.pytest.ini_options]
# Docstring examples are tests too.
testpaths = ["src", "packages/core/src", "tests", "trainers/torchvision/src", "trainers/torchvision/tests"]
addopts = "--doctest-modules"

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "dvc[gdrive]>=3.59",
    "jsonschema>=4.26.0",
    "pre-commit>=4",
    "pydoclint>=0.10.0",
    "pylint>=4.0.9",
    "pyopenssl>=24.2.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["numpy"]

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.design]
# The numpy code ported from Matterport keeps its original, step-by-step structure.
max-locals = 25
max-attributes = 12

[tool.pylint.format]
max-line-length = 100

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0
