[project]
name = "fashion-seg"
version = "0.1.0"
description = "Fashion instance segmentation on iMaterialist: data pipeline, training of several models, MLflow packaging"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg-contract",
    "fashion-seg-core",
    "maskrcnn-matterport",
    "mlflow>=3.16,<3.17",
    "numpy>=2.5.3",
    "polars>=1.20",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "tensorflow>=2.18",
]

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
fashion-seg-core = { workspace = true }
# Released wheels, referenced by URL like packages from a registry (GitHub Releases).
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl" }
maskrcnn-matterport = { url = "https://github.com/thibaudchevrier/maskrcnn-matterport-tf2/releases/download/v0.3.0/maskrcnn_matterport-0.3.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "commitizen>=4.19",
    "dvc[gdrive]>=3.59",
    "jsonschema>=4.26.0",
    "pre-commit>=4",
    "pylint>=4.0.9",
    "pyopenssl>=24.2.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["numpy"]

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.pylint.design]
# The numpy code ported from Matterport keeps its original, step-by-step structure.
max-locals = 25
max-attributes = 12

[tool.pylint.format]
max-line-length = 100

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0
