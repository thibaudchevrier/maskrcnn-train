name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_CPP_MIN_LOG_LEVEL: "2"

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Every commit of the PR follows Conventional Commits
        run: >-
          uvx --from commitizen==4.19.0 cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  quality:
    name: Lint (pre-commit hooks = make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make lint

  tests:
    name: Tests (${{ matrix.env.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - { name: "library", project: ".", target: test-core }
          - { name: "torchvision", project: families/torchvision, target: test-torchvision }
          - { name: "matterport training", project: families/matterport, target: test-matterport-train }
          - { name: "matterport serving", project: families/matterport/serve, target: test-matterport-serve }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --project ${{ matrix.env.project }}
      - run: make ${{ matrix.env.target }}

  secrets-check:
    name: Detect DVC credentials
    runs-on: ubuntu-latest
    outputs:
      gdrive: ${{ steps.check.outputs.gdrive }}
    steps:
      - id: check
        env:
          HAS_GDRIVE: ${{ secrets.GDRIVE_CREDENTIALS_DATA != '' }}
        run: |
          echo "gdrive=$HAS_GDRIVE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_GDRIVE" != "true" ]; then
            echo "::notice::GDRIVE_CREDENTIALS_DATA is not set: ML checks are skipped (see README)."
          fi

  ml:
    name: ML checks (DVC pipeline + real model)
    needs: secrets-check
    if: needs.secrets-check.outputs.gdrive == 'true'
    runs-on: ubuntu-latest
    env:
      # Service account JSON key, read by DVC's Google Drive remote.
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - name: Use the service account for the DVC remote
        run: uv run dvc remote modify --local myremote gdrive_use_service_account true
      - name: Pull pipeline inputs and the published model
        run: |
          uv run dvc pull deployement.dvc data/imaterialist/label_descriptions.json package_legacy
      - name: Published model is up to date with code, params and data
        run: |
          status="$(uv run dvc status --json package_legacy)"
          echo "$status"
          if [ "$status" != "{}" ]; then
            echo "::error::dvc.lock is stale: run 'uv run dvc repro --single-item package_legacy', 'uv run dvc push' and commit dvc.lock."
            exit 1
          fi
      - name: Tests against the real model
        run: make test
