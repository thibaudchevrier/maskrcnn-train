# Single source of truth for code quality: `make lint` and the CI lint job both run
# `pre-commit run --all-files`, so local hooks and CI check exactly the same things.
# Install once: make hooks
# ruff and pydoclint run from the root environment for all code; pylint runs in the environment
# of the code it checks (it needs the imports): orchestration env, or trainers/<name>.
# `uv run --no-sync`: during a partial commit pre-commit hides unstaged changes (e.g. a uv.lock
# matching staged pyproject.toml edits); syncing would then try to rewrite the lockfile.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.dvc$|dvc\.lock$  # generated by DVC
      - id: end-of-file-fixer
        exclude: \.dvc$|dvc\.lock$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files  # data and models belong in DVC, not git
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check (lint + numpy docstrings)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: pydoclint
        name: pydoclint (documented parameters, returns, raises)
        entry: uv run --no-sync pydoclint
        language: system
        types: [python]
        exclude: /tests/|^tests/
      - id: pylint
        name: pylint (orchestration env)
        entry: uv run --no-sync pylint
        language: system
        types: [python]
        files: ^(src|packages/core/src)/
      # Tests: pytest fixtures shadow names (redefined-outer-name); pylint infers the length of lists
      # from their empty literal, so `[result] = model.predict(...)` is a false positive.
      - id: pylint-tests
        name: pylint (orchestration tests)
        entry: uv run --no-sync pylint --disable=redefined-outer-name,unbalanced-tuple-unpacking
        language: system
        types: [python]
        files: ^tests/
      - id: pylint-matterport
        name: pylint (Matterport trainer env)
        entry: >-
          uv run --no-sync --project trainers/matterport pylint
          --rcfile trainers/matterport/pyproject.toml
        language: system
        types: [python]
        files: ^trainers/matterport/src/
      - id: pylint-matterport-tests
        name: pylint (Matterport trainer tests)
        entry: >-
          uv run --no-sync --project trainers/matterport pylint
          --rcfile trainers/matterport/pyproject.toml
          --disable=redefined-outer-name,unbalanced-tuple-unpacking
        language: system
        types: [python]
        files: ^trainers/matterport/tests/
      - id: commitizen
        name: conventional commit message
        entry: uv run --no-sync cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
