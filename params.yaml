# Pipeline parameters, validated at load time by fashion_seg.config (unknown keys are errors).
data:
  train_csv: data/imaterialist/train.csv
  train_images: data/imaterialist/train
  label_file: data/imaterialist/label_descriptions.json
  prepared_dir: prepared

# Frozen split shared by every model. Defaults reproduce the 2021 notebook
# (KFold, 8 folds, shuffle, seed 42, fold 0 = validation).
split:
  n_folds: 8
  fold: 0
  seed: 42

tracking:
  training_experiment: fashion-seg-training
  packaging_experiment: fashion-maskrcnn
  evaluation_experiment: fashion-seg-evaluation
  registered_name: fashion-maskrcnn     # every packaged model is a version of it

# Training parameters per model family (train_<family> stages), validated by the family's
# Config (families/<family>/src/fashion_seg_<family>/__init__.py).
train:
  # Matterport Mask R-CNN. Defaults follow the 2021 notebook.
  matterport:
    output_dir: outputs/matterport
    init_weights: weights/mask_rcnn_coco.h5   # COCO weights; heads are re-initialised
    epochs: 2
    max_train_images: null       # null = all
    max_val_images: null
    backbone: resnet101
    image_min_dim: 800
    image_max_dim: 1024
    images_per_gpu: 2
    rpn_anchor_scales: [16, 32, 64, 128, 256]
    train_rois_per_image: 32
    learning_rate: 0.0001
    layers: all                  # "heads", "3+", "4+", "5+" or "all"
    steps_per_epoch: null        # null = one pass over the training images
    validation_steps: null
    detection_min_confidence: 0.7
    log_every: 50
    checkpoint_every: 500        # a stop, crash or power cut loses at most this many steps
    seed: 0                      # numpy seed of the fork's shuffle and ROI sampling
    resume: true                 # continue from checkpoints/last.h5 if present

  # torchvision Mask R-CNN v2, fine-tuned from COCO.
  torchvision:
    output_dir: outputs/torchvision
    init_weights: weights/maskrcnn_resnet50_fpn_v2_coco.pth
    epochs: 4                 # resumed from the 1-epoch run: the cosine schedule restarts over 4
    max_train_images: null    # null = all
    max_val_images: 500       # validation loss each epoch on a subset (mAP: evaluate stage)
    min_size: 800
    max_size: 1024
    batch_size: 2
    learning_rate: 0.0025     # torchvision's 0.02 for batch 16, scaled to batch 2
    momentum: 0.9
    weight_decay: 0.0001
    warmup_steps: 1000
    num_workers: 4
    log_every: 50
    checkpoint_every: 500     # ~7 min on the Apple GPU: the most a stop can lose
    seed: 0                   # shuffle order: reproducible, so a stopped run resumes mid-epoch
    device: auto              # CUDA, then Apple GPU (MPS), then CPU
    resume: true              # continue from checkpoints/last.pt if present

  # Mask2Former (Swin-Tiny), fine-tuned from COCO instance segmentation.
  mask2former:
    output_dir: outputs/mask2former
    init_weights: weights/mask2former-swin-tiny-coco-instance   # Hugging Face model directory
    epochs: 1
    max_train_images: null    # null = all
    max_val_images: 500       # validation loss each epoch on a subset (mAP: evaluate stage)
    max_size: 1024            # long side, as torchvision's
    batch_size: 2
    learning_rate: 0.0001     # AdamW, Mask2Former's recipe
    backbone_lr_factor: 0.1   # the Swin backbone learns 10x slower
    weight_decay: 0.05
    warmup_steps: 500
    num_workers: 4
    log_every: 50
    checkpoint_every: 500
    seed: 0                   # shuffle order: reproducible, so a stopped run resumes mid-epoch
    device: auto              # CUDA, then Apple GPU (MPS), then CPU
    resume: true              # continue from checkpoints/last.pt if present

  # YOLO11s segmentation (Ultralytics), fine-tuned from COCO. Ultralytics' recipe expects many
  # short epochs (augmentation, EMA); a stop resumes at the start of the interrupted epoch.
  yolo:
    output_dir: outputs/yolo
    init_weights: weights/yolo11s-seg.pt
    model: yolo11s-seg        # architecture, when training from scratch (tests)
    epochs: 10
    max_train_images: null    # null = all
    max_val_images: 500       # validation (losses, mask mAP) each epoch on a subset
    imgsz: 640                # letterboxed square, Ultralytics' default
    batch_size: 16
    learning_rate: 0.01       # SGD, Ultralytics' default
    optimizer: SGD            # "auto" would pick from the run length and ignore learning_rate
    num_workers: 4            # dataset conversion (Ultralytics loads in-process on MPS and CPU)
    log_every: 50
    checkpoint_every: 500
    seed: 0
    device: auto              # CUDA, then Apple GPU (MPS), then CPU
    resume: true              # continue from checkpoints/runs/train/weights/last.pt if present

# Served models: package_<name> wraps an export as an MLflow pyfunc model (the contract),
# evaluate_<name> scores it. Each is packaged and evaluated in its family's environment.
models:
  legacy:                        # the 2021 model
    family: matterport
    source: deployement
    output_dir: models/fashion-maskrcnn
  torchvision:
    family: torchvision
    source: outputs/torchvision/model
    output_dir: models/fashion-maskrcnn-torchvision
  mask2former:
    family: mask2former
    source: outputs/mask2former/model
    output_dir: models/fashion-mask2former
  yolo:
    family: yolo
    source: outputs/yolo/model
    output_dir: models/fashion-yolo

# Scores each packaged model on the frozen split, as it is served.
evaluate:
  split: val
  max_images: null        # null = the whole split (5,703 images, ~1.5 h on CPU)
  min_score: 0.0          # request parameter; the 2021 model still drops < 0.7 in its graph
  output_dir: metrics
