# Training environment of the Matterport family: Python 3.11 + TensorFlow 2.15
# (maskrcnn-matterport[train]), next to the same fashion_seg package as the root environment.
# `python -m fashion_seg train matterport` switches to it on its own (fashion_seg.runtime).
[project]
name = "fashion-seg-env-matterport"
version = "0.1.0"
description = "Training environment of the Matterport family"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fashion-seg",
    "maskrcnn-matterport[train]",
]

[tool.uv]
package = false

[tool.uv.sources]
fashion-seg = { path = "../..", editable = true }
# Released wheels, referenced by URL like packages from a registry (GitHub Releases).
# Same URLs as in the root pyproject.toml.
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl" }
maskrcnn-matterport = { url = "https://github.com/thibaudchevrier/maskrcnn-matterport-tf2/releases/download/v0.3.1/maskrcnn_matterport-0.3.1-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest",
    "pylint",
]

# pylint for the code that only runs here (see .pre-commit-config.yaml); the rest of the lint
# configuration is the root pyproject.toml's.
[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.format]
max-line-length = 100
