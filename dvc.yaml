# Every stage runs `python -m fashion_seg <command>` (src/fashion_seg/__main__.py).
# Code dependencies: the workflow step (service/), the modules it uses, and the family's code.
stages:
  prepare:
    cmd: python -m fashion_seg prepare
    deps:
      - ${data.train_csv}
      - src/fashion_seg/service/preparation.py
      - src/fashion_seg/data
    params:
      - data.train_csv
      - data.prepared_dir
      - split
    outs:
      - ${data.prepared_dir}

  # Runs itself in envs/matterport (Python 3.11, TensorFlow 2.15).
  train_matterport:
    cmd: python -m fashion_seg train matterport
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train.matterport.init_weights}
      - src/fashion_seg/families/matterport
      - src/fashion_seg/service/training.py
      - src/fashion_seg/data
      - envs/matterport/uv.lock
    params:
      - data
      - split
      - train.matterport
    outs:
      - ${train.matterport.output_dir}/model
    metrics:
      - ${train.matterport.output_dir}/metrics.json:
          cache: false

  train_torchvision:
    cmd: python -m fashion_seg train torchvision
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train.torchvision.init_weights}
      - src/fashion_seg/families/torchvision
      - src/fashion_seg/service/training.py
      - src/fashion_seg/data
    params:
      - data
      - split
      - train.torchvision
    outs:
      - ${train.torchvision.output_dir}/model
    metrics:
      - ${train.torchvision.output_dir}/metrics.json:
          cache: false

  # The packaged model bundles all of src/fashion_seg: any code change re-packages it.
  package:
    foreach: ${models}
    do:
      cmd: python -m fashion_seg package ${key}
      deps:
        - ${item.source}
        - ${data.label_file}
        - src/fashion_seg
      params:
        - models.${key}
        - tracking.packaging_experiment
        - tracking.registered_name
        # Pinned wheels of fashion-seg-contract / maskrcnn-matterport: the model's requirements.
        - pyproject.toml:
            - tool.uv.sources
      outs:
        - ${item.output_dir}

  evaluate:
    foreach: ${models}
    do:
      cmd: python -m fashion_seg evaluate ${key}
      deps:
        - ${item.output_dir}
        # prepared/ follows the dataset version. The images are read from data/ but pulled
        # separately (make pull-val), so they are not a dependency: a partial pull would record
        # the hash of whatever subset is on disk.
        - ${data.prepared_dir}
        - src/fashion_seg/service/evaluation.py
        - src/fashion_seg/scoring.py
      params:
        - data.prepared_dir
        - data.train_images
        - data.label_file
        - tracking.evaluation_experiment
        - evaluate
      metrics:
        - ${evaluate.output_dir}/evaluate-${key}.json:
            cache: false
