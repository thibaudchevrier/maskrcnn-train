stages:
  prepare:
    cmd: python -m fashion_seg.prepare
    deps:
      - ${data.train_csv}
      - src/fashion_seg/prepare.py
      - packages/core/src/fashion_seg_core/annotations.py
    params:
      - data.train_csv
      - data.prepared_dir
      - split
    outs:
      - ${data.prepared_dir}

  train_matterport:
    cmd: uv run --project trainers/matterport --locked python -m fashion_seg_matterport.train
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train_matterport.init_weights}
      - trainers/matterport/src
      - trainers/matterport/uv.lock
      - packages/core/src/fashion_seg_core
    params:
      - data
      - split
      - train_matterport
    outs:
      - ${train_matterport.output_dir}/model
    metrics:
      - ${train_matterport.output_dir}/metrics.json:
          cache: false

  package_legacy:
    cmd: python -m fashion_seg.package legacy_model
    deps:
      - ${legacy_model.model_dir}
      - ${legacy_model.label_file}
      - src/fashion_seg
    params:
      - legacy_model
      # Pinned wheels of fashion-seg-contract / maskrcnn-matterport: the model's requirements.
      - pyproject.toml:
          - tool.uv.sources

  train_torchvision:
    cmd: python -m fashion_seg_torchvision.train
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train_torchvision.init_weights}
      - trainers/torchvision/src
      - packages/core/src/fashion_seg_core
    params:
      - data
      - split
      - train_torchvision
    outs:
      - ${train_torchvision.output_dir}/model
    metrics:
      - ${train_torchvision.output_dir}/metrics.json:
          cache: false

  package_torchvision:
    cmd: python -m fashion_seg.package torchvision_model
    deps:
      - ${torchvision_model.model_dir}
      - ${torchvision_model.label_file}
      - src/fashion_seg
      - trainers/torchvision/src/fashion_seg_torchvision/model.py
    params:
      - torchvision_model
      - pyproject.toml:
          - tool.uv.sources
    outs:
      - ${torchvision_model.output_dir}

  evaluate:
    foreach: ${evaluate.models}
    do:
      cmd: python -m fashion_seg.evaluate --model ${key}
      deps:
        - ${item}
        # prepared/ follows the dataset version. The images are read from data/ but pulled
        # separately (make pull-val), so they are not a dependency: a partial pull would record
        # the hash of whatever subset is on disk.
        - ${data.prepared_dir}
        - src/fashion_seg/evaluate.py
      params:
        - data.prepared_dir
        - data.train_images
        - data.label_file
        - evaluate
      metrics:
        - ${evaluate.output_dir}/evaluate-${key}.json:
            cache: false
