stages:
  prepare:
    cmd: python -m fashion_seg.prepare
    deps:
      - ${data.train_csv}
      - src/fashion_seg/prepare.py
      - packages/core/src/fashion_seg_core/annotations.py
    params:
      - data.train_csv
      - data.prepared_dir
      - split
    outs:
      - ${data.prepared_dir}

  train_matterport:
    cmd: uv run --project trainers/matterport --locked python -m fashion_seg_matterport.train
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train_matterport.init_weights}
      - trainers/matterport/src
      - trainers/matterport/uv.lock
      - packages/core/src/fashion_seg_core
    params:
      - data
      - split
      - train_matterport
    outs:
      - ${train_matterport.output_dir}/model
    metrics:
      - ${train_matterport.output_dir}/metrics.json:
          cache: false

  package_legacy:
    cmd: python -m fashion_seg.package_legacy
    deps:
      - ${legacy_model.saved_model_dir}
      - ${legacy_model.label_file}
      - src/fashion_seg
    params:
      - legacy_model
      # Pinned wheels of fashion-seg-contract / maskrcnn-matterport: the model's requirements.
      - pyproject.toml:
          - tool.uv.sources
    outs:
      - ${legacy_model.output_dir}

  evaluate:
    cmd: python -m fashion_seg.evaluate
    deps:
      - ${evaluate.model_dir}
      # prepared/ follows the dataset version. The images are read from data/ but pulled
      # separately (make pull-val), so they are not a dependency: a partial pull would record
      # the hash of whatever subset is on disk.
      - ${data.prepared_dir}
      - src/fashion_seg/evaluate.py
    params:
      - data.prepared_dir
      - data.train_images
      - data.label_file
      - evaluate
    metrics:
      - ${evaluate.output}:
          cache: false
