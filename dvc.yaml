# Each stage runs in the uv environment it needs, through an explicit entrypoint:
#   python -m fashion_seg prepare                                  root environment
#   uv run --project families/<family> python -m fashion_seg_<family> train | package | evaluate
# Code dependencies: the workflow step (packages/fashion-seg/.../service), the modules it uses,
# and the family's code and lock file (its framework versions).
vars:
  - lib: packages/fashion-seg/src/fashion_seg

stages:
  prepare:
    cmd: python -m fashion_seg prepare
    deps:
      - ${data.train_csv}
      - ${lib}/service/preparation.py
      - ${lib}/data
    params:
      - data.train_csv
      - data.prepared_dir
      - split
    outs:
      - ${data.prepared_dir}

  # Python 3.11, TensorFlow 2.15.
  train_matterport:
    cmd: uv run --project families/matterport --locked python -m fashion_seg_matterport train
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train.matterport.init_weights}
      # The family's training modules only: a serving change (predictor) keeps the training.
      - families/matterport/src/fashion_seg_matterport/__init__.py
      - families/matterport/src/fashion_seg_matterport/config.py
      - families/matterport/src/fashion_seg_matterport/dataset.py
      - families/matterport/src/fashion_seg_matterport/training.py
      - families/matterport/uv.lock
      - ${lib}/service/training.py
      - ${lib}/data
    params:
      - data
      - split
      - train.matterport
    outs:
      - ${train.matterport.output_dir}/model
    metrics:
      - ${train.matterport.output_dir}/metrics.json:
          cache: false

  # Python 3.12, PyTorch (CUDA, Apple GPU or CPU).
  train_torchvision:
    cmd: uv run --project families/torchvision --locked python -m fashion_seg_torchvision train
    deps:
      - ${data.prepared_dir}
      - ${data.train_images}
      - ${data.label_file}
      - ${train.torchvision.init_weights}
      # The family's training modules only: a serving change (predictor) keeps the training.
      - families/torchvision/src/fashion_seg_torchvision/__init__.py
      - families/torchvision/src/fashion_seg_torchvision/config.py
      - families/torchvision/src/fashion_seg_torchvision/dataset.py
      - families/torchvision/src/fashion_seg_torchvision/network.py
      - families/torchvision/src/fashion_seg_torchvision/training.py
      - families/torchvision/uv.lock
      - ${lib}/service/training.py
      - ${lib}/data
    params:
      - data
      - split
      - train.torchvision
    outs:
      - ${train.torchvision.output_dir}/model
    metrics:
      - ${train.torchvision.output_dir}/metrics.json:
          cache: false

  # A packaged model bundles the library and the family's code, and pins the serving
  # environment's versions (its lock file): any of them changing re-packages it.
  package_legacy:
    cmd: >-
      uv run --project families/matterport/serve --locked
      python -m fashion_seg_matterport package legacy
    deps:
      - ${models.legacy.source}
      - ${data.label_file}
      - ${lib}
      - families/matterport/src
      - families/matterport/serve/uv.lock
    params:
      - models.legacy
      - tracking.packaging_experiment
      - tracking.registered_name
    outs:
      - ${models.legacy.output_dir}

  package_torchvision:
    cmd: >-
      uv run --project families/torchvision --locked
      python -m fashion_seg_torchvision package torchvision
    deps:
      - ${models.torchvision.source}
      - ${data.label_file}
      - ${lib}
      - families/torchvision/src
      - families/torchvision/uv.lock
    params:
      - models.torchvision
      - tracking.packaging_experiment
      - tracking.registered_name
    outs:
      - ${models.torchvision.output_dir}

  # prepared/ follows the dataset version. The images are read from data/ but pulled separately
  # (make pull-val), so they are not a dependency: a partial pull would record the hash of
  # whatever subset is on disk.
  evaluate_legacy:
    cmd: >-
      uv run --project families/matterport/serve --locked
      python -m fashion_seg_matterport evaluate legacy
    deps:
      - ${models.legacy.output_dir}
      - ${data.prepared_dir}
      - ${lib}/service/evaluation.py
      - ${lib}/scoring.py
    params:
      - data.prepared_dir
      - data.train_images
      - data.label_file
      - tracking.evaluation_experiment
      - evaluate
    metrics:
      - ${evaluate.output_dir}/evaluate-legacy.json:
          cache: false

  evaluate_torchvision:
    cmd: >-
      uv run --project families/torchvision --locked
      python -m fashion_seg_torchvision evaluate torchvision
    deps:
      - ${models.torchvision.output_dir}
      - ${data.prepared_dir}
      - ${lib}/service/evaluation.py
      - ${lib}/scoring.py
    params:
      - data.prepared_dir
      - data.train_images
      - data.label_file
      - tracking.evaluation_experiment
      - evaluate
    metrics:
      - ${evaluate.output_dir}/evaluate-torchvision.json:
          cache: false
