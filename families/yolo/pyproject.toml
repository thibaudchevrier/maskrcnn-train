# The YOLO family: its code (src/fashion_seg_yolo) and its environment, which trains, packages and
# evaluates it: `uv run --project families/yolo python -m fashion_seg_yolo`.
# Ultralytics is AGPL-3.0: serving it over a network obliges to publish the service's source.
[project]
name = "fashion-seg-yolo"
version = "0.1.0"
description = "YOLO segmentation (Ultralytics) family of fashion-seg-train"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg",
    "fashion-seg-torch",
    "torch>=2.8",
    # Ultralytics' NMS: a direct dependency so that Linux gets the CPU build matching torch
    # (uv applies [tool.uv.sources] to direct dependencies only).
    "torchvision>=0.23",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = ["fashion-seg-testing", "jsonschema>=4.26.0", "pylint>=4.0.9", "pytest>=9.1.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
fashion-seg = { path = "../../packages/fashion-seg", editable = true }
fashion-seg-testing = { path = "../../packages/fashion-seg-testing", editable = true }
fashion-seg-torch = { path = "../../packages/fashion-seg-torch", editable = true }
# Linux (CI, Docker, cloud CPU): CPU-only PyTorch wheels, without ~2 GB of CUDA libraries.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_yolo"]

[tool.pytest.ini_options]
# Docstring examples are tests too.
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["numpy"]

[tool.pylint.typecheck]
# OpenCV is a compiled module whose members pylint cannot see.
generated-members = ["cv2.*"]

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.format]
max-line-length = 100
