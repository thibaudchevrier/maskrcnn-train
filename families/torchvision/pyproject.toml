# The torchvision family: its code (src/fashion_seg_torchvision) and its environment, which trains,
# packages and evaluates it: `uv run --project families/torchvision python -m fashion_seg_torchvision`.
[project]
name = "fashion-seg-torchvision"
version = "0.1.0"
description = "torchvision Mask R-CNN v2 family of fashion-seg-train"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg",
    "torch>=2.8",
    "torchvision>=0.23",
]

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pylint>=4.0.9", "pytest>=9.1.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
fashion-seg = { path = "../../packages/fashion-seg", editable = true }
# Linux (CI, Docker, cloud CPU): CPU-only PyTorch wheels, without ~2 GB of CUDA libraries.
# macOS wheels include the Apple GPU (MPS) backend.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# Released wheels, by URL (same as packages/fashion-seg).
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_torchvision"]

[tool.pytest.ini_options]
# Docstring examples are tests too.
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.pylint.main]
py-version = "3.12"
extension-pkg-allow-list = ["numpy"]

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.format]
max-line-length = 100
