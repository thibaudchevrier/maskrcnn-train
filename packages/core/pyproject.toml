[project]
name = "fashion-seg-core"
version = "0.1.0"
description = "Framework-agnostic building blocks shared by the orchestration env and every trainer"
requires-python = ">=3.10"
# Keep this light: it is installed next to TensorFlow 2.15 (numpy 1.x) and next to
# TensorFlow 2.21 / PyTorch (numpy 2.x). mlflow must match across envs (shared mlflow.db).
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "pyarrow>=14",
    "mlflow>=3.16,<3.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_core"]
