[project]
name = "fashion-seg-torchvision"
version = "0.1.0"
description = "Trains torchvision Mask R-CNN v2 on the prepared iMaterialist data, tracked in MLflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg-contract",
    "fashion-seg-core",
    "numpy",
    "pillow",
    "pyyaml",
    "torch>=2.8",
    "torchvision>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_torchvision"]
