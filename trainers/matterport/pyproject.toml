[project]
name = "fashion-seg-matterport"
version = "0.1.0"
description = "Trains Matterport Mask R-CNN on the prepared iMaterialist data, tracked in MLflow"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fashion-seg-contract",
    "fashion-seg-core",
    "maskrcnn-matterport[train]",
    "pyyaml",
]

[tool.uv.sources]
fashion-seg-core = { path = "../../packages/core", editable = true }
# Released wheels, referenced by URL like packages from a registry (GitHub Releases).
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.1.0/fashion_seg_contract-0.1.0-py3-none-any.whl" }
maskrcnn-matterport = { url = "https://github.com/thibaudchevrier/maskrcnn-matterport-tf2/releases/download/v0.3.0/maskrcnn_matterport-0.3.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest",
    "pylint",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_matterport"]

[tool.pytest.ini_options]
# Docstring examples are tests too.
testpaths = ["src", "tests"]
addopts = "--doctest-modules"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
# Import order is ruff's job (isort rules), which knows the first-party packages.
disable = ["too-few-public-methods", "wrong-import-order", "ungrouped-imports"]

[tool.pylint.format]
max-line-length = 100
