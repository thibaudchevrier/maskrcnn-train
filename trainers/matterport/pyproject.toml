[project]
name = "fashion-seg-matterport"
version = "0.1.0"
description = "Trains Matterport Mask R-CNN on the prepared iMaterialist data, tracked in MLflow"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fashion-seg-core",
    "maskrcnn-matterport",
    "pyyaml",
]

[tool.uv.sources]
fashion-seg-core = { path = "../../packages/core", editable = true }
maskrcnn-matterport = { git = "https://github.com/thibaudchevrier/maskrcnn-matterport-tf2", tag = "v0.2.0" }

[dependency-groups]
dev = ["pytest", "pylint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_seg_matterport"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.pylint.format]
max-line-length = 100
